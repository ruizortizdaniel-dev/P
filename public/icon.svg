<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="adif-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#adif-bg)"/>
  <!-- Shield outline -->
  <path d="M256 60 L390 120 V250 C390 340 330 415 256 450 C182 415 122 340 122 250 V120 Z" fill="url(#badge-grad)" stroke="#60a5fa" stroke-width="12"/>
