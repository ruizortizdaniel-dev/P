    <rect x="65" y="0" width="50" height="35" rx="6"/>
    <rect x="130" y="0" width="50" height="35" rx="6"/>
    <rect x="0" y="48" width="50" height="35" rx="6"/>
    <rect x="65" y="48" width="50" height="35" rx="6"/>
    <rect x="130" y="48" width="50" height="35" rx="6"/>
    <rect x="0" y="96" width="50" height="35" rx="6"/>
    <rect x="65" y="96" width="50" height="35" rx="6"/>
    <rect x="130" y="96" width="50" height="35" rx="6"/>
  </g>
  <text x="256" y="425" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#cbd5e1" text-anchor="middle" letter-spacing="3">PATRULLAS BCN</text>
</svg>
